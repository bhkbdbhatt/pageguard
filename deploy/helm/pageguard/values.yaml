replicaCount: 1

image:
  repository: ghcr.io/pageguard/pageguard
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: pageguard.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

config:
  addr: ":8080"
  logLevel: "info"
  pluginsDir: "/app/plugins"
  # Set to "" to disable the headless browser (HTTP-only crawling).
  browserCommand: "node /app/tools/browser-renderer/index.mjs"

# Database connection. Use an external secret in production.
postgres:
  enabled: true
  host: pageguard-postgres
  port: 5432
  user: pageguard
  password: pageguard
  database: pageguard
  sslMode: disable
  # If enabled, a bundled single-instance Postgres is deployed (dev only).
  bundled: false

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75

nodeSelector: {}
tolerations: []
affinity: {}

podDisruptionBudget:
  enabled: false
  minAvailable: 1
